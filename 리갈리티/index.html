<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Re:gality Another</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #2e2e2e; /* 회색 배경 */
    }

    .background-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('임시.jpg') no-repeat center center fixed; /* 임시 */
      background-size: cover;
      z-index: -1; /* 이미지가 컨텐츠 뒤에 배치되도록 */
    }

    .content {
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #444;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); /* 미세한 빛의 효과 */
    }

    .heading {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #ff4f4f; /* 붉은색 */
    }

    .description {
      font-size: 18px;
      line-height: 1.6;
    }

    .description strong {
      color: #ff4f4f; /* 붉은색 강조 */
    }

    .button-container {
      margin-top: 40px;
    }

    .button {
      background: linear-gradient(135deg, #ff4f4f, #ff2a2a); /* 붉은색 그라데이션 */
      border: none;
      color: white;
      padding: 15px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
      transition: all 0.3s ease-in-out;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); /* 미세한 빛의 효과 */
    }

    .button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      background: linear-gradient(135deg, #ff2a2a, #ff4f4f);
    }

    .button:active {
      transform: scale(0.9);
      background: #e60000;
    }

  </style>
</head>
<body>
  <div class="background-image"></div> <!-- 배경 이미지 삽입 -->
  <div class="content">
    <div class="heading">자, 너의 죄를 노래해</div>
    <div class="description">
      <p><strong>밀그램 기반 프로젝트, 리갈리티</strong></p>
      <p>리갈리티는 12명의 독특한 캐릭터와 함께 진행되는 음모와 갈등이 얽힌 이야기입니다. 각자의 죄와 비밀을 숨기고, 그들의 선택은 어느 쪽으로 흐를까요? 이 웹사이트는 그들의 세계로 초대합니다. 죄를 노래하는 공간에서, 그들의 이야기를 따라가 보세요.</p>
    </div>

    <div class="button-container">
      <button class="button" onclick="window.location.href='심문페이지.html'">심문</button>
      <button class="button" onclick="window.location.href='스토리페이지.html'">스토리</button>
      <button class="button" onclick="window.location.href='시스템페이지.html'">시스템</button>
      <button class="button" onclick="window.location.href='캐릭터페이지.html'">캐릭터</button>
      <button class="button" onclick="window.location.href='노래페이지.html'">노래</button>
      <button class="button" onclick="window.location.href='판결페이지.html'">판결</button>
    </div>
  </div>
</body>
</html>
<link rel="stylesheet" href="style.css">
